[project]
name = "deep-research-agent"
version = "0.1.0"
description = "A multi-agent deep research pipeline (plan searches, search the web, write a report, email it) built on the OpenAI Agents SDK, routed through OpenRouter."
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.14.0",
    "openai-agents>=0.15.1",
    "openai>=2.34.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
]
